name: Verify GYM-OS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: gym_os
          MYSQL_USER: gymos
          MYSQL_PASSWORD: ci-database-only
        ports: [3307:3306]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: gymos
      DB_PASSWORD: ci-database-only
      MAIL_TRANSPORT: file
      AI_MOCK: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Prepare dedicated test database
        run: |
          node --input-type=module <<'JS'
          import mysql from 'mysql2/promise';
          const db = await mysql.createConnection({host:'127.0.0.1',port:3307,user:'root',password:'ci-root-only'});
          await db.query('CREATE DATABASE IF NOT EXISTS gym_os_test');
          await db.query("GRANT ALL PRIVILEGES ON gym_os_test.* TO 'gymos'@'%'");
          await db.end();
          JS
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
